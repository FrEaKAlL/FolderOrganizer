name: Bug report
description: Report a problem or unexpected behavior in FolderOrganizer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with FolderOrganizer.

        Please provide as much information as possible so the issue can be reproduced and investigated.

  - type: input
    id: version
    attributes:
      label: FolderOrganizer version
      description: Which version of FolderOrganizer are you using?
      placeholder: "Example: v1.1.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      description: Which operating system are you using?
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: dropdown
    id: execution-mode
    attributes:
      label: Execution mode
      description: How are you running FolderOrganizer?
      options:
        - Windows Service
        - Manual execution
        - Development environment
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe the problem you encountered.
      placeholder: Tell us what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the problem.
      placeholder: |
        1. Start FolderOrganizer
        2. Select...
        3. Configure...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect FolderOrganizer to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Add any relevant logs, error messages or screenshots.

        Please remove personal or sensitive information before submitting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other information that may help investigate the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that a similar issue has not already been reported.
          required: true
        - label: I am using a supported/recent version of FolderOrganizer.
          required: true
