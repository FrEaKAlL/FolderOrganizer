name: Reportar un error
description: Reporta un problema o comportamiento inesperado en FolderOrganizer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un problema con FolderOrganizer.

        Proporciona toda la información posible para que el problema pueda reproducirse e investigarse.

  - type: input
    id: version
    attributes:
      label: Versión de FolderOrganizer
      description: ¿Qué versión de FolderOrganizer estás utilizando?
      placeholder: "Ejemplo: v1.2.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Sistema operativo
      description: ¿Qué sistema operativo estás utilizando?
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Otro
    validations:
      required: true

  - type: dropdown
    id: execution-mode
    attributes:
      label: Modo de ejecución
      description: ¿Cómo estás ejecutando FolderOrganizer?
      options:
        - Servicio de Windows
        - Servicio systemd en Linux
        - Ejecución manual
        - Entorno de desarrollo
        - Otro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Describe el problema que encontraste.
      placeholder: Cuéntanos qué ocurrió.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Indica los pasos necesarios para reproducir el problema.
      placeholder: |
        1. Iniciar FolderOrganizer
        2. Seleccionar...
        3. Configurar...
        4. Se presenta el error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué esperabas que hiciera FolderOrganizer?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento real
      description: ¿Qué ocurrió en su lugar?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas de pantalla
      description: |
        Agrega logs, mensajes de error o capturas de pantalla relevantes.

        Elimina cualquier información personal o sensible antes de enviar el reporte.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Contexto adicional
      description: Agrega cualquier otra información que pueda ayudar a investigar el problema.

  - type: checkboxes
    id: checks
    attributes:
      label: Antes de enviar
      options:
        - label: Verifiqué que no exista un reporte similar.
          required: true
        - label: Estoy utilizando una versión compatible o reciente de FolderOrganizer.
          required: true
