name: Create release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --limit-output --yes

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "The tag ${{ github.ref_name }} does not match package.json version $version."
          }

      - name: Build installer
        run: pnpm run build:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-Installer
          path: dist/FolderOrganizer-Installer/FolderOrganizer_Installer.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: FolderOrganizer-Installer
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/FolderOrganizer_Installer.exe" --title "Folder Organizer ${{ github.ref_name }}" --generate-notes
